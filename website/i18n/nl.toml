[hero_desc]
other = "Een native macOS-app gebouwd op de GPU-gerenderde terminal van <a href=\"https://ghostty.org\" class=\"text-wine-light hover:underline\">Ghostty</a>. Beheert git worktrees, <a href=\"https://docs.anthropic.com/en/docs/claude-code/overview\" class=\"text-wine-light hover:underline\">Claude Code</a>-sessies en dev-servers vanuit één venster. Elke workstream krijgt een eigen branch, terminal en AI-agent — allemaal parallel, allemaal op native snelheid."
