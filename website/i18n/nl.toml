# Features
[features_label]
other = "Functies"
[features_title]
other = "Alles in één venster."
[features_desc]
other = "Geen gejongleer meer met terminals, browsers en git-clients. Elke workstream is een op zichzelf staande ontwikkelomgeving."
[feat_worktrees_title]
other = "Git Worktrees"
[feat_worktrees_desc]
other = "Elke workstream krijgt een eigen branch en worktree. Wissel tussen taken zonder te stashen, met automatisch gesymlinkte .env-bestanden."
[feat_claude_title]
other = "Claude Code"
[feat_claude_desc]
other = "Geïntegreerde <a href='https://docs.anthropic.com/en/docs/claude-code/overview' class='text-wine-light no-underline hover:underline'>Claude Code</a>-agent met sessiepersistentie. Hervat gesprekken na het herstarten van de app dankzij automatische sessie-ID's."
[feat_tmux_title]
other = "Tmux-persistentie"
[feat_tmux_desc]
other = "Agent-sessies overleven het herstarten van de app via tmux op een dedicated socket. Geen verloren context of onderbroken workflows meer."
[feat_scripts_title]
other = "Setup- & run-scripts"
[feat_scripts_desc]
other = "Configureer setup-, run- en teardown-scripts per project via .factoryfloor.json."
[feat_browser_title]
other = "Ingebouwde browser"
[feat_browser_desc]
other = "Ingebouwde browser met automatische poortdetectie. De luisterende poort van het run-script wordt automatisch gedetecteerd en de browser navigeert ernaar. Bekijk je app zonder de werkruimte te verlaten."
[feat_github_title]
other = "GitHub-integratie"
[feat_github_desc]
other = "Bekijk repo-info, open PR's en branch-PR-status direct in de projectweergave. Aangedreven door de gh CLI."

# How it works
[how_label]
other = "Hoe het werkt"
[how_title]
other = "Drie stappen naar parallel ontwikkelen."
[how_desc]
other = "Ga van repo naar draaiende workstream in seconden. Elke workstream is geïsoleerd en op zichzelf staand."
[step1_title]
other = "Voeg een project toe"
[step1_desc]
other = "Sleep een map op de zijbalk, of maak een nieuwe aan. Factory Floor detecteert git-repo's, geïnstalleerde tools en GitHub-koppelingen automatisch."
[step2_title]
other = "Maak een workstream aan"
[step2_desc]
other = "Een nieuwe git worktree met een verse branch, een Claude Code-sessie, een terminal en een browsertab. Poortdetectie is automatisch — de browser opent je dev-server zodra die begint te luisteren."
[step3_title]
other = "Programmeer met AI"
[step3_desc]
other = "De Coding Agent hernoemt je branch passend bij de taak. Setup-scripts installeren dependencies. Wissel tussen workstreams zonder state te verliezen."

# Config
[config_label]
other = "Configuratie"
[config_title]
other = "Drop-in scriptconfiguratie."
[config_desc]
other = "Automatiseer de levenscyclus van je workstream met setup-, run- en teardown-scripts. Installeer dependencies bij het aanmaken van een worktree, start dev-servers op aanvraag en ruim resources op bij het archiveren."
[config_add]
other = "Voeg een"
[config_or_use]
other = "toe aan je projectroot."
[config_hook]
other = "Hook"
[config_when]
other = "Wanneer het draait"
[config_setup_desc]
other = "Eenmalig, bij het aanmaken van een workstream. Gebruik voor het installeren van dependencies of buildstappen."
[config_run_desc]
other = "Op aanvraag via het Omgeving-tabblad. Gewrapped in ff-run voor automatische poortdetectie."
[config_teardown_desc]
other = "Bij het archiveren van een workstream. Gebruik voor opruimacties zoals het stoppen van containers."
[config_optional_note]
other = "Alle velden zijn optioneel. Scripts draaien in de workstream-map met je login-shell."

